name: Monitoramento diario da Reforma Tributaria
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: monitoramento-reforma-tributaria
  cancel-in-progress: false
jobs:
  conferir-fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar publicacoes e abrir triagem quando houver novidade
        run: node scripts/monitor-reforma.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
