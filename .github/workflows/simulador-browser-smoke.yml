            assert.match(ownerBrief.currentTax, /PENDENTE/i);
            assert.doesNotMatch(ownerBrief.bestTotal, /^—$/);
            assert.match(ownerBrief.bestLabel, /referência histórica/i);
            assert.doesNotMatch(ownerBrief.breakEven, /^—$/);
            assert.match(ownerBrief.pending, /lucratividade futura/i);
            assert.match(ownerBrief.pending, /contribuição patronal/i);
            assert.match(ownerBrief.pending, /carga líquida atual/i);
            assert.match(ownerBrief.why, /ponto aproximado de indiferença|lucratividade futura/i);
            assert.match(ownerBrief.simpleText, /Simples Nacional não aplicável pelo faturamento informado|Referência atual do Simples indisponível/i);
            assert.match(ownerBrief.badge, /REFERÊNCIA HISTÓRICA/i);
            assert.match(ownerBrief.title, /Resultado sensível à lucratividade/i);
            assert.match(ownerBrief.sensitivityAlert, /Resultado condicionado à lucratividade futura/i);
            assert.equal(ownerBrief.sensitivityRows, 3);
            assert.match(ownerBrief.timeline, /Sensível à margem futura/i);

            await page.evaluate(() => {
              const mode = document.getElementById('currentConsumptionMode');
