name: Simulador browser smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simulador-browser-smoke.yml'
      - 'simulador/**'
      - 'api/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test production simulator in Chromium
        env:
          BASE_URL: https://www.obrasilmudadeimposto.com.br
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

            let deployedVersion = '';
            for (let attempt = 0; attempt < 24; attempt++) {
              await page.goto(process.env.BASE_URL + '/simulador/guiado/', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const versionLink = page.locator('link[href*="guided.css"]').first();
              deployedVersion = await versionLink.count() ? (await versionLink.getAttribute('href') || '') : '';
              if (/20260925-rrfinance-tax43/.test(deployedVersion)) break;
              await page.waitForTimeout(15000);
            }
            assert.match(deployedVersion || '', /20260925-rrfinance-tax43/);
            await page.waitForSelector('#cnpj', { timeout: 30000 });
            await page.waitForSelector('#importPanel', { timeout: 30000 });
            assert.equal(await page.locator('#importPanel').isVisible(), true);
            const importPlacement = await page.evaluate(() => {
              const panel = document.getElementById('importPanel');
              const company = document.getElementById('cnpj')?.closest('.panel');
              return {
                insideCompany: !!(panel && company && company.contains(panel)),
                title: panel?.querySelector('.sectionTitle h2')?.textContent || ''
              };
            });
            assert.equal(importPlacement.insideCompany, true);
            assert.match(importPlacement.title, /Importar dados da empresa|Envie o que você já possui/i);
            await page.waitForSelector('#guidedNav', { timeout: 30000 });

            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#cnpj');
            await page.waitForSelector('#importPanel', { timeout: 30000 });
            await page.waitForFunction(() => typeof window.lookupCnpj === 'function', { timeout: 30000 });

            await page.evaluate(() => localStorage.setItem('brmi_v3', JSON.stringify({ cnpj: '39.345.897/0001-20' })));
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#cnpj');
            await page.waitForTimeout(900);
            assert.equal(await page.inputValue('#cnpj'), '');
            assert.equal(await page.getAttribute('#cnpj','autocomplete'), 'off');

            const logoCheck = await page.evaluate(() => {
              const frame = document.querySelector('.erpBrandLogoFrame');
              const img = document.querySelector('.erpBrandLogo');
              return {
                frameVisible: !!frame && getComputedStyle(frame).display !== 'none',
                frameOverflow: frame ? getComputedStyle(frame).overflow : '',
                imageWidth: img?.getBoundingClientRect().width || 0,
                frameWidth: frame?.getBoundingClientRect().width || 0,
                src: img?.getAttribute('src') || ''
              };
            });
            assert.equal(logoCheck.frameVisible, true);
            assert.equal(logoCheck.frameOverflow, 'hidden');
            assert.ok(logoCheck.imageWidth > logoCheck.frameWidth);
            assert.match(logoCheck.src, /homo-fictor-logo-header\.png/);

            const initialCompletion = (await page.textContent('#fieldCompletionText') || '').trim();
            assert.match(initialCompletion, /^0 de \d+ campos confirmados$/);

            const apiResponse = await page.request.get(process.env.BASE_URL + '/api/cnpj?cnpj=03204058000145');
            assert.equal(apiResponse.status(), 200);
            const apiPayload = await apiResponse.json();
            assert.match(apiPayload?.data?.razao_social || '', /ORTHOHEAD/i);

            const lookupResult = await page.evaluate(async () => {
              const input = document.getElementById('cnpj');
              input.value = '03.204.058/0001-45';
              await lookupCnpj();
              return {
                company: document.getElementById('companyName')?.textContent || '',
                status: document.getElementById('lookupStatus')?.textContent || ''
              };
            });
            assert.match(lookupResult.company, /ORTHOHEAD/i);

            const company = await page.textContent('#companyName');
            const activity = await page.inputValue('#activity');
            const b2b = await page.inputValue('#b2bPct');
            assert.match(company || '', /ORTHOHEAD/i);
            assert.match(activity || '', /4664-8\/00|4664800|odonto|médico|medico/i);
            assert.equal(b2b, '95');

            const treatmentWarningBefore = await page.evaluate(() => {
              const btn = document.getElementById('acceptTaxTreatmentSuggestion');
              return {
                button: !!btn,
                accepted: document.getElementById('taxTreatmentAccepted')?.value || ''
              };
            });
            assert.equal(treatmentWarningBefore.button, true);
            await page.click('[data-guided-nav="2"]');
            await page.evaluate(() => document.getElementById('acceptTaxTreatmentSuggestion')?.click());
            const treatmentAccepted = await page.inputValue('#taxTreatmentAccepted');
            assert.equal(treatmentAccepted, 'yes');

            const factorRState = await page.evaluate(() => {
              const simple = document.getElementById('simpleStatus');
              const payroll = document.getElementById('monthlyPayroll');
              const factor = document.getElementById('factorMode');
              const annex = document.getElementById('annex');

              simple.value = 'no';
              calculate();
              const outside = {
                payrollDisabled: payroll.disabled,
                factorDisabled: factor.disabled,
                annexDisabled: annex.disabled,
                payrollHint: document.getElementById('factorPayrollHint')?.textContent || ''
              };

              simple.value = 'yes';
              calculate();
              const inside = {
                payrollDisabled: payroll.disabled,
                factorDisabled: factor.disabled,
                annexDisabled: annex.disabled
              };

              simple.value = 'no';
              calculate();
              return { outside, inside };
            });

            assert.equal(factorRState.outside.payrollDisabled, true);
            assert.equal(factorRState.outside.factorDisabled, true);
            assert.equal(factorRState.outside.annexDisabled, true);
            assert.match(factorRState.outside.payrollHint, /Não aplicável/i);
            const payrollBadge = await page.locator('#monthlyPayroll').locator('xpath=ancestor::*[contains(concat(" ", normalize-space(@class), " "), " field ")][1]').locator(':scope > .fieldStateBadge').textContent();
            const factorBadge = await page.locator('#factorMode').locator('xpath=ancestor::*[contains(concat(" ", normalize-space(@class), " "), " field ")][1]').locator(':scope > .fieldStateBadge').textContent();
            assert.equal((payrollBadge || '').trim(), 'N/A');
            assert.equal((factorBadge || '').trim(), 'N/A');
            assert.equal(factorRState.inside.payrollDisabled, false);
            assert.equal(factorRState.inside.factorDisabled, false);
            assert.equal(factorRState.inside.annexDisabled, false);

            const importCheck = await page.evaluate(() => {
              const profit = document.getElementById('realAccountingProfitAnnual');
              const rbt12 = document.getElementById('rbt12');
              profit.value = '0';
              delete profit.dataset.userEdited;
              rbt12.value = '';

              const syntheticDre = [
                'DEMONSTRAÇÃO DE RESULTADO DO EXERCÍCIO',
                'Entidade: EMPRESA TESTE LTDA',
                'Período da Escrituração: 01/01/2025 a 31/12/2025 CNPJ: 03.204.058/0001-45',
                'Descrição Nota Saldo anterior Saldo atual',
                'RECEITA LIQUIDA R$ 900.000,00 R$ 1.000.000,00',
                '(-) DESPESAS FINANCEIRAS R$ (18.000,00) R$ (20.000,00)',
                'LUCRO LIQUIDO ANTES PROVISAO IRPJ E CSLL R$ 90.000,00 R$ 100.000,00',
                '(-) PROVISAO P/ IRPJ E CSLL R$ (27.000,00) R$ (30.000,00)',
                'LUCRO LIQUIDO DO EXERCICIO R$ 63.000,00 R$ 70.000,00'
              ].join('\n');

              const doc = analyseImportDoc({ name: 'dre-teste.pdf' }, { text: syntheticDre, rows: null });
              brmiImport.docs = [doc];
              brmiImport.candidates = [...doc.candidates];
              brmiImport.candidates.forEach((x, i) => x._index = i);
              const written = writeVerifiedAccountingProfit();
              return {
                written,
                profit: parseMoneyValue(profit.value),
                rbt12Candidates: brmiImport.candidates.filter(x => x.field === 'rbt12').length
              };
            });

            assert.equal(importCheck.written, 100000);
            assert.equal(importCheck.profit, 100000);
            assert.equal(importCheck.rbt12Candidates, 0);

            const rrVehiclesImport = await page.evaluate(() => {
              const bp = [
                'Balanço',
                'Período: 12/2025 a 12/2025',
                'RR VEICULOS LTDA - CNPJ: 42.255.172/0001-56',
                'Conta Descrição Saldo em reais',
                '1 A T I V O 5.505.362,52 D',
                '11 ATIVO CIRCULANTE 4.246.762,84 D',
                '111 DISPONIBILIDADES 315.102,10 D',
                '111001 CAIXA 5.369,68 D',
                '111002 BANCOS CONTA MOVIMENTO 309.732,42 D',
                '112 VALOR A RECEBER A CURTO PRAZO 505.820,39 D',
                '112001 FINANCIAMENTO DAS VENDAS 481.168,38 D',
                '112002 ( - ) CREDITOS DE BANCOS A CLASSIFICAR 39.414,14 C',
                '112010 CONTAS VINCULADAS COM A FABRICA 45.086,97 D',
                '112015 ADIANTAMENTOS 15.891,05 D',
                '112025 IMPOSTOS A RECUPERAR 3.088,13 D',
                '113 ESTOQUES 3.425.840,35 D',
                '113100 ESTOQUES VEICULOS NOVOS 2.724.449,45 D',
                '113200 VEICULOS SEMINOVOS 25.000,00 D',
                '113300 ESTOQUES PECAS ACESSORIOS E PROD DIVERSOS 676.390,90 D',
                '12 ATIVO NAO CIRCULANTE 1.258.599,68 D',
                '123 IMOBILIZADO 1.251.674,40 D',
                '123001 IMOBILIZACOES TECNICAS TANGIVEIS 1.617.485,25 D',
                '123002 ( - ) DEPREC ACUM DE IMOB TEC TANGIVEIS 365.810,85 C',
                '2 P A S S I V O 5.505.362,52 C',
                '21 PASSIVO CIRCULANTE 3.887.215,54 C',
                '211 OBRIGACOES A PAGAR 3.817.873,10 C',
                '211001 FORNECEDOR FABRICA 3.261.820,00 C',
                '211002 FORNECEDORES DIVERSOS 309.419,77 C',
                '211006 CREDITOS DE CLIENTES 35.272,54 C',
                '211007 EMPRESTIMOS A CURTO PRAZO 453.682,15 C',
                '211008 EMPRESTIMOS OUTRAS FONTES 33.454,19 C',
                '211101 ( - ) DEVOLUCOES DE COMPRAS 275.775,55 D',
                '22 PASSIVO NAO CIRCULANTE 1.538.500,00 C',
                '221 EXIGIVEL A LONGO PRAZO 1.538.500,00 C',
                '221005 OBRIGACOES A PAGAR 1.538.500,00 C',
                '24 PATRIMONIO LIQUIDO 79.646,98 C',
                '241 CAPITAL SOCIAL 1.574.508,64 C',
                '245 LUCROS OU PREJUIZOS ACUMULADOS 1.424,77 C',
                '248 PREJUIZOS ACUMULADOS 1.496.286,43 D'
              ].join('\n');
              const dre = [
                'Demonstrativo de Resultado',
                'Valores em reais',
                'RR VEICULOS LTDA - CNPJ: 42.255.172/0001-56',
                'Período: 01/2025 a 12/2025',
                'Conta Reduzida Descrição Saldo Anterior Débito Crédito Saldo Atual',
                '3 2157 CONTAS DE RESULTADOS 0,00 9.004.151,01 8.942.376,60 61.774,41 D',
                '3.1 2158 RECEITA OPERACIONAL BRUTA 0,00 237.533,35 7.953.703,40 7.716.170,05 C',
                '3.2 2209 IMPOSTOS S/ VENDAS 0,00 460.560,53 7.065,16 453.495,37 D',
                '3.2.2.002 2233 PIS SEMINOVOS 0,00 471,25 0,00 471,25 D',
                '3.2.2.003 2235 COFINS SEMINOVOS 0,00 2.175,00 0,00 2.175,00 D',
                '3.2.3.001 2238 ICMS PECAS ACESSORIOS PROD DIVS 0,00 274.912,96 6.637,83 268.275,13 D',
                '3.2.3.002 2244 PIS PECAS ACESSORIOS PROD DIVS 0,00 7.276,78 76,59 7.200,19 D',
                '3.2.3.003 2250 COFINS PECAS ACESSORIOS PROD DIVS 0,00 33.517,05 350,74 33.166,31 D',
                '3.2.4.001 2257 ISS SERVICOS 0,00 39.130,12 0,00 39.130,12 D',
                '3.2.4.002 2259 PIS SERVICOS 0,00 10.141,31 0,00 10.141,31 D',
                '3.2.4.003 2261 COFINS SERVICOS 0,00 46.708,97 0,00 46.708,97 D',
                '3.2.5.001 2264 ISS COMISSOES 0,00 32.306,01 0,00 32.306,01 D',
                '3.2.5.002 2266 PIS COMISSOES 0,00 2.483,20 0,00 2.483,20 D',
                '3.2.5.003 2268 COFINS COMISSOES 0,00 11.437,88 0,00 11.437,88 D',
                '3.3 2270 CUSTOS OPERACIONAIS 0,00 5.201.454,76 311.164,25 4.890.290,51 D',
                '3.4 2318 DESPESAS OPERACIONAIS 0,00 2.022.146,72 125.916,60 1.896.230,12 D',
                '3.4.2 2342 DESPESAS COM PESSOAL E ENCARGOS 0,00 453.095,12 29.388,22 423.706,90 D',
                '3.4.2.102 2343 SALARIOS E ORDENADOS 0,00 209.487,34 659,71 208.827,63 D',
                '3.4.3 2378 DESPESAS ADMINISTRATIVAS E GERAIS 0,00 706.648,61 15.709,40 690.939,21 D',
                '3.4.3.222 2384 DEPRECIACAO E AMORTIZACAO 0,00 200.353,64 0,00 200.353,64 D',
                '3.4.3.223 2386 ALUGUEIS LOCACAO E LEASING 0,00 139.315,00 0,00 139.315,00 D',
                '3.5 2442 OUTROS RESULTADOS OPERACIONAIS 0,00 544.580,75 516.516,05 28.064,70 D',
                '3.6.2 2494 DESPESAS FINANCEIRAS 0,00 537.587,20 21.821,26 515.765,94 D',
                '3.6.2.001 2495 ENCARGOS S/ APLICACOES FINANCEIRAS 0,00 58.284,60 21.417,43 36.867,17 D',
                '3.7.1.001 2517 PROVISAO P/ IRPJ E CONTRIBUICAO SOCIAL 0,00 287,70 0,00 287,70 D'
              ].join('\n');

              const bpDoc = analyseImportDoc({ name: 'Balanço 2025 RR VEICULOS.pdf' }, { text: bp, rows: null, extraction: 'text' });
              const dreDoc = analyseImportDoc({ name: 'DRE 2025 RR VEICULOS.pdf' }, { text: dre, rows: null, extraction: 'text' });
              const pick = (doc, field) => doc.candidates.filter(x => x.field === field).map(x => ({ value: x.value, label: x.label, confidence: x.confidence, usageConfidence: x.usageConfidence, reason: x.reason, ebitdaAnnual: x.ebitdaAnnual, unclassifiedLongTerm: x.unclassifiedLongTerm }));
              return {
                bp: {
                  equity: pick(bpDoc,'equity'), fixedAssets: pick(bpDoc,'fixedAssets'), taxesRecoverable: pick(bpDoc,'taxesRecoverable'),
                  cash: pick(bpDoc,'cashAndEquivalents'), currentAssets: pick(bpDoc,'currentAssets'), currentLiabilities: pick(bpDoc,'currentLiabilities'),
                  receivables: pick(bpDoc,'accountsReceivable'), inventory: pick(bpDoc,'inventory'), suppliers: pick(bpDoc,'suppliersPayable'), debt: pick(bpDoc,'debtEnd')
                },
                dre: {
                  revenue: pick(dreDoc,'rbt12'), admin: pick(dreDoc,'adminExpenses'), finance: pick(dreDoc,'interestExpense'),
                  investments: pick(dreDoc,'liquidInvestments'), debt: pick(dreDoc,'debtEnd'), taxTotal: pick(dreDoc,'currentConsumptionTaxAnnual'),
                  pisCofins: pick(dreDoc,'currentPisCofinsAnnual'), icms: pick(dreDoc,'currentIcmsAnnual'), iss: pick(dreDoc,'currentIssAnnual'),
                  payroll: pick(dreDoc,'monthlyPayroll'), cpp: pick(dreDoc,'monthlyCppBase'),
                  profit: pick(dreDoc,'realAccountingProfitAnnual'), margin: pick(dreDoc,'currentOperatingMarginPct'),
                  legacyRate: pick(dreDoc,'legacyRate'), purchasesProxy: pick(dreDoc,'purchasesPct'),
                  usedVehiclesMention: dreDoc.usedVehiclesMention === true
                }
              };
            });
            const one = arr => arr?.[0]?.value;
            assert.ok(Math.abs(one(rrVehiclesImport.bp.equity) - 79646.98) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.fixedAssets) - 1251674.40) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.taxesRecoverable) - 3088.13) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.cash) - 315102.10) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.currentAssets) - 4246762.84) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.currentLiabilities) - 3887215.54) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.receivables) - 505820.39) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.inventory) - 3425840.35) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.suppliers) - 3571239.77) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.bp.debt) - 487136.34) < .02);
            assert.match(rrVehiclesImport.bp.receivables[0].label, /Valores a receber no curto prazo/i);
            assert.match(rrVehiclesImport.bp.receivables[0].reason, /financiamento das vendas/i);
            assert.match(rrVehiclesImport.bp.debt[0].label, /Dívida financeira identificada/i);
            assert.ok(Math.abs((rrVehiclesImport.bp.debt[0].unclassifiedLongTerm || 0) - 1538500) < .02);
            assert.match(rrVehiclesImport.bp.debt[0].reason, /não foi incluído na dívida|ficou fora da dívida/i);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.revenue) - 7716170.05) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.admin) - 690939.21) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.finance) - 515765.94) < .02);
            assert.equal(rrVehiclesImport.dre.finance[0].confidence, 'high');
            assert.equal(rrVehiclesImport.dre.finance[0].usageConfidence, 'medium');
            assert.match(rrVehiclesImport.dre.finance[0].reason, /uso como aproximação do custo da dívida exige revisão/i);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.profit) - (-61486.71)) < .02);
            assert.match(rrVehiclesImport.dre.profit[0].reason, /reconstruído.*resultado final/i);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.margin) - 8.928416) < .01);
            assert.ok(Math.abs((rrVehiclesImport.dre.margin[0].ebitdaAnnual || 0) - 648442.99) < .02);
            assert.match(rrVehiclesImport.dre.margin[0].reason, /EBITDA reconstruído/i);
            assert.equal(rrVehiclesImport.dre.investments.length, 0);
            assert.equal(rrVehiclesImport.dre.debt.length, 0);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.taxTotal) - 453495.37) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.pisCofins) - 113784.11) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.icms) - 268275.13) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.iss) - 71436.13) < .02);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.legacyRate) - 4.4025890798) < .001);
            assert.match(rrVehiclesImport.dre.legacyRate[0].reason, /ICMS \+ ISS.*receita bruta/i);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.purchasesProxy) - 63.3771738869) < .001);
            assert.equal(rrVehiclesImport.dre.purchasesProxy[0].confidence, 'medium');
            assert.equal(rrVehiclesImport.dre.usedVehiclesMention, true);
            assert.ok(Math.abs(one(rrVehiclesImport.dre.payroll) - 35308.90833333333) < .02);
            if (rrVehiclesImport.dre.cpp.length) assert.ok(Math.abs(one(rrVehiclesImport.dre.cpp) - 17402.3025) < .02);

            const financeFallbackCheck = await page.evaluate(() => {
              const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=String(v)};
              set('financeRateMode','auto');set('dreMonths',12);set('debtStart','');set('debtEnd',487136.34);set('interestExpense',515765.94);
              const inconsistent=financialMetrics();
              const fallbackValue=Number(document.getElementById('financeRate')?.value||0);
              const fallbackText=document.getElementById('financeRateSource')?.textContent||'';
              set('debtEnd',2025636.34);
              const reconciled=financialMetrics();
              const reconciledValue=Number(document.getElementById('financeRate')?.value||0);
              return {inconsistent,fallbackValue,fallbackText,reconciled,reconciledValue};
            });
            assert.ok(Math.abs(financeFallbackCheck.inconsistent.rawAnnualRate - 1.0587712261) < .001);
            assert.equal(financeFallbackCheck.inconsistent.rateSource, 'reference');
            assert.equal(financeFallbackCheck.inconsistent.needsReview, true);
            assert.ok(Math.abs(financeFallbackCheck.fallbackValue - 25) < .001);
            assert.match(financeFallbackCheck.fallbackText, /25% a\.a\.|25,0% a\.a\./i);
            assert.ok(Math.abs(financeFallbackCheck.reconciled.rawAnnualRate - .2546192176) < .001);
            assert.equal(financeFallbackCheck.reconciled.rateSource, 'observed');
            assert.equal(financeFallbackCheck.reconciled.needsReview, false);
            assert.ok(Math.abs(financeFallbackCheck.reconciledValue - 25.46) < .02);

            const fiscalMismatchCheck = await page.evaluate(() => {
              const syntheticLossDre = [
                'DEMONSTRAÇÃO DO RESULTADO DO EXERCÍCIO',
                '2025',
                'RECEITA OPERACIONAL BRUTA 4.329.470,09',
                'RECEITA OPERACIONAL LÍQUIDA 3.770.667,11',
                'RESULTADO ANTES DOS TRIBUTOS S/ LUCRO (183.865,94)',
                'PROVISÃO PARA CSLL (51.304,39)',
                'PROVISÃO PARA IRPJ (91.319,32)',
                'RESULTADO DO EXERCÍCIO (326.489,65)'
              ].join('\n');
              const doc = analyseImportDoc({ name: 'dre2025-pedra-lisa.pdf' }, { text: syntheticLossDre, rows: null });
              const candidate = doc.candidates.find(x => x.field === 'realAccountingProfitAnnual');
              if (!candidate) return { candidate: false };
              brmiImport.candidates = [candidate];
              brmiImport.candidates[0]._index = 0;
              const written = writeVerifiedAccountingProfit();
              const profit = document.getElementById('realAccountingProfitAnnual');
              const out = {
                candidate: true,
                fiscalMismatch: candidate.fiscalMismatch === true,
                written,
                datasetMismatch: profit?.dataset?.importFiscalMismatch || '',
                importedProfit: parseMoneyValue(profit?.value || ''),
                provision: Number(profit?.dataset?.importIrpjExpense || 0) + Number(profit?.dataset?.importCsllExpense || 0),
                reason: candidate.reason || ''
              };
              if (profit) {
                delete profit.dataset.importFiscalMismatch;
                delete profit.dataset.importIrpjExpense;
                delete profit.dataset.importCsllExpense;
                delete profit.dataset.importAccepted;
                delete profit.dataset.importVerified;
                delete profit.dataset.importSource;
                delete profit.dataset.importConfidence;
              }
              brmiImport.candidates = [];
              return out;
            });
            assert.equal(fiscalMismatchCheck.candidate, true);
            assert.equal(fiscalMismatchCheck.fiscalMismatch, true);
            assert.ok(fiscalMismatchCheck.written < 0);
            assert.equal(fiscalMismatchCheck.datasetMismatch, '1');
            assert.ok(fiscalMismatchCheck.importedProfit < 0);
            assert.ok(fiscalMismatchCheck.provision > 140000);
