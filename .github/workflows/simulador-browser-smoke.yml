name: Simulador browser smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simulador-browser-smoke.yml'
      - 'simulador/**'
      - 'api/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test production simulator in Chromium
        env:
          BASE_URL: https://www.obrasilmudadeimposto.com.br
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

            let deployedVersion = '';
            for (let attempt = 0; attempt < 24; attempt++) {
              await page.goto(process.env.BASE_URL + '/simulador/guiado/', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const versionLink = page.locator('link[href*="guided.css"]').first();
              deployedVersion = await versionLink.count() ? (await versionLink.getAttribute('href') || '') : '';
              if (/20260924-explain37/.test(deployedVersion)) break;
              await page.waitForTimeout(15000);
            }
            assert.match(deployedVersion || '', /20260924-explain37/);
            await page.waitForSelector('#cnpj', { timeout: 30000 });
            await page.waitForSelector('#importPanel', { timeout: 30000 });
            assert.equal(await page.locator('#importPanel').isVisible(), true);
            const importPlacement = await page.evaluate(() => {
              const panel = document.getElementById('importPanel');
              const company = document.getElementById('cnpj')?.closest('.panel');
              return {
                insideCompany: !!(panel && company && company.contains(panel)),
                title: panel?.querySelector('.sectionTitle h2')?.textContent || ''
              };
            });
            assert.equal(importPlacement.insideCompany, true);
            assert.match(importPlacement.title, /Importar dados da empresa|Envie o que você já possui/i);
            await page.waitForSelector('#guidedNav', { timeout: 30000 });

            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#cnpj');
            await page.waitForSelector('#importPanel', { timeout: 30000 });
            await page.waitForFunction(() => typeof window.lookupCnpj === 'function', { timeout: 30000 });

            await page.evaluate(() => localStorage.setItem('brmi_v3', JSON.stringify({ cnpj: '39.345.897/0001-20' })));
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#cnpj');
            await page.waitForTimeout(900);
            assert.equal(await page.inputValue('#cnpj'), '');
            assert.equal(await page.getAttribute('#cnpj','autocomplete'), 'off');

            const logoCheck = await page.evaluate(() => {
              const frame = document.querySelector('.erpBrandLogoFrame');
              const img = document.querySelector('.erpBrandLogo');
              return {
                frameVisible: !!frame && getComputedStyle(frame).display !== 'none',
                frameOverflow: frame ? getComputedStyle(frame).overflow : '',
                imageWidth: img?.getBoundingClientRect().width || 0,
                frameWidth: frame?.getBoundingClientRect().width || 0,
                src: img?.getAttribute('src') || ''
              };
            });
            assert.equal(logoCheck.frameVisible, true);
            assert.equal(logoCheck.frameOverflow, 'hidden');
            assert.ok(logoCheck.imageWidth > logoCheck.frameWidth);
            assert.match(logoCheck.src, /homo-fictor-logo-header\.png/);

            const initialCompletion = (await page.textContent('#fieldCompletionText') || '').trim();
            assert.match(initialCompletion, /^0 de \d+ campos confirmados$/);

            const apiResponse = await page.request.get(process.env.BASE_URL + '/api/cnpj?cnpj=03204058000145');
            assert.equal(apiResponse.status(), 200);
            const apiPayload = await apiResponse.json();
            assert.match(apiPayload?.data?.razao_social || '', /ORTHOHEAD/i);

            const lookupResult = await page.evaluate(async () => {
              const input = document.getElementById('cnpj');
              input.value = '03.204.058/0001-45';
              await lookupCnpj();
              return {
                company: document.getElementById('companyName')?.textContent || '',
                status: document.getElementById('lookupStatus')?.textContent || ''
              };
            });
            assert.match(lookupResult.company, /ORTHOHEAD/i);

            const company = await page.textContent('#companyName');
            const activity = await page.inputValue('#activity');
            const b2b = await page.inputValue('#b2bPct');
            assert.match(company || '', /ORTHOHEAD/i);
            assert.match(activity || '', /4664-8\/00|4664800|odonto|médico|medico/i);
            assert.equal(b2b, '95');

            const treatmentWarningBefore = await page.evaluate(() => {
              const btn = document.getElementById('acceptTaxTreatmentSuggestion');
              return {
                button: !!btn,
                accepted: document.getElementById('taxTreatmentAccepted')?.value || ''
              };
            });
            assert.equal(treatmentWarningBefore.button, true);
            await page.click('[data-guided-nav="2"]');
            await page.evaluate(() => document.getElementById('acceptTaxTreatmentSuggestion')?.click());
            const treatmentAccepted = await page.inputValue('#taxTreatmentAccepted');
            assert.equal(treatmentAccepted, 'yes');

            const factorRState = await page.evaluate(() => {
              const simple = document.getElementById('simpleStatus');
              const payroll = document.getElementById('monthlyPayroll');
              const factor = document.getElementById('factorMode');
              const annex = document.getElementById('annex');

              simple.value = 'no';
              calculate();
              const outside = {
                payrollDisabled: payroll.disabled,
                factorDisabled: factor.disabled,
                annexDisabled: annex.disabled,
                payrollHint: document.getElementById('factorPayrollHint')?.textContent || ''
              };

              simple.value = 'yes';
              calculate();
              const inside = {
                payrollDisabled: payroll.disabled,
                factorDisabled: factor.disabled,
                annexDisabled: annex.disabled
              };

              simple.value = 'no';
              calculate();
              return { outside, inside };
            });

            assert.equal(factorRState.outside.payrollDisabled, true);
            assert.equal(factorRState.outside.factorDisabled, true);
            assert.equal(factorRState.outside.annexDisabled, true);
            assert.match(factorRState.outside.payrollHint, /Não aplicável/i);
            const payrollBadge = await page.locator('#monthlyPayroll').locator('xpath=ancestor::*[contains(concat(" ", normalize-space(@class), " "), " field ")][1]').locator(':scope > .fieldStateBadge').textContent();
            const factorBadge = await page.locator('#factorMode').locator('xpath=ancestor::*[contains(concat(" ", normalize-space(@class), " "), " field ")][1]').locator(':scope > .fieldStateBadge').textContent();
            assert.equal((payrollBadge || '').trim(), 'N/A');
            assert.equal((factorBadge || '').trim(), 'N/A');
            assert.equal(factorRState.inside.payrollDisabled, false);
            assert.equal(factorRState.inside.factorDisabled, false);
            assert.equal(factorRState.inside.annexDisabled, false);

            const importCheck = await page.evaluate(() => {
              const profit = document.getElementById('realAccountingProfitAnnual');
              const rbt12 = document.getElementById('rbt12');
              profit.value = '0';
              delete profit.dataset.userEdited;
              rbt12.value = '';

              const syntheticDre = [
                'DEMONSTRAÇÃO DE RESULTADO DO EXERCÍCIO',
                'Entidade: EMPRESA TESTE LTDA',
                'Período da Escrituração: 01/01/2025 a 31/12/2025 CNPJ: 03.204.058/0001-45',
                'Descrição Nota Saldo anterior Saldo atual',
                'RECEITA LIQUIDA R$ 900.000,00 R$ 1.000.000,00',
                '(-) DESPESAS FINANCEIRAS R$ (18.000,00) R$ (20.000,00)',
                'LUCRO LIQUIDO ANTES PROVISAO IRPJ E CSLL R$ 90.000,00 R$ 100.000,00',
                '(-) PROVISAO P/ IRPJ E CSLL R$ (27.000,00) R$ (30.000,00)',
                'LUCRO LIQUIDO DO EXERCICIO R$ 63.000,00 R$ 70.000,00'
              ].join('\n');

              const doc = analyseImportDoc({ name: 'dre-teste.pdf' }, { text: syntheticDre, rows: null });
              brmiImport.docs = [doc];
              brmiImport.candidates = [...doc.candidates];
              brmiImport.candidates.forEach((x, i) => x._index = i);
              const written = writeVerifiedAccountingProfit();
              return {
                written,
                profit: parseMoneyValue(profit.value),
                rbt12Candidates: brmiImport.candidates.filter(x => x.field === 'rbt12').length
              };
            });

            assert.equal(importCheck.written, 100000);
            assert.equal(importCheck.profit, 100000);
            assert.equal(importCheck.rbt12Candidates, 0);

            const fiscalMismatchCheck = await page.evaluate(() => {
              const syntheticLossDre = [
                'DEMONSTRAÇÃO DO RESULTADO DO EXERCÍCIO',
                '2025',
                'RECEITA OPERACIONAL BRUTA 4.329.470,09',
                'RECEITA OPERACIONAL LÍQUIDA 3.770.667,11',
                'RESULTADO ANTES DOS TRIBUTOS S/ LUCRO (183.865,94)',
                'PROVISÃO PARA CSLL (51.304,39)',
                'PROVISÃO PARA IRPJ (91.319,32)',
                'RESULTADO DO EXERCÍCIO (326.489,65)'
              ].join('\n');
              const doc = analyseImportDoc({ name: 'dre2025-pedra-lisa.pdf' }, { text: syntheticLossDre, rows: null });
              const candidate = doc.candidates.find(x => x.field === 'realAccountingProfitAnnual');
              if (!candidate) return { candidate: false };
              brmiImport.candidates = [candidate];
              brmiImport.candidates[0]._index = 0;
              const written = writeVerifiedAccountingProfit();
              const profit = document.getElementById('realAccountingProfitAnnual');
              const out = {
                candidate: true,
                fiscalMismatch: candidate.fiscalMismatch === true,
                written,
                datasetMismatch: profit?.dataset?.importFiscalMismatch || '',
                importedProfit: parseMoneyValue(profit?.value || ''),
                provision: Number(profit?.dataset?.importIrpjExpense || 0) + Number(profit?.dataset?.importCsllExpense || 0),
                reason: candidate.reason || ''
              };
              if (profit) {
                delete profit.dataset.importFiscalMismatch;
                delete profit.dataset.importIrpjExpense;
                delete profit.dataset.importCsllExpense;
                delete profit.dataset.importAccepted;
                delete profit.dataset.importVerified;
                delete profit.dataset.importSource;
                delete profit.dataset.importConfidence;
              }
              brmiImport.candidates = [];
              return out;
            });
            assert.equal(fiscalMismatchCheck.candidate, true);
            assert.equal(fiscalMismatchCheck.fiscalMismatch, true);
            assert.ok(fiscalMismatchCheck.written < 0);
            assert.equal(fiscalMismatchCheck.datasetMismatch, '1');
            assert.ok(fiscalMismatchCheck.importedProfit < 0);
            assert.ok(fiscalMismatchCheck.provision > 140000);
            assert.match(fiscalMismatchCheck.reason, /base fiscal zero|ajustes fiscais/i);

            const regimeCheck = await page.evaluate(() => {
              const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = String(v); };
              set('monthlyRevenue', 1000000);
              set('rbt12', 12000000);
              set('simpleStatus', 'no');
              set('monthlyCppBase', '');
              set('legacyRate', 10);
              set('profitProjectionMode', 'sensitivity');
              set('projectedRealProfitAnnual', '');
              set('realAccountingProfitAnnual', 100000);
              const a = modelForYear(2027);
              set('monthlyCppBase', 100000);
              const b = modelForYear(2027);
              const ap = a.allModels.find(x => x.key === 'presumed');
              const ar = a.allModels.find(x => x.key === 'real');
              const bp = b.allModels.find(x => x.key === 'presumed');
              const br = b.allModels.find(x => x.key === 'real');
              const rec = recommendation(a);
              return {
                sensitivity: {
                  active: a.realDecisionSensitive,
                  breakEvenProfit: a.breakEven?.profit || 0,
                  breakEvenMargin: a.breakEven?.margin || 0,
                  scenarios: a.profitSensitivity?.length || 0,
                  recommendationKey: rec.key
                },
                withoutCpp: {
                  presumed: ap.valid,
                  real: ar.valid,
                  presumedTotalComplete: ap.totalComplete,
                  realTotalComplete: ar.totalComplete,
                  difference: ap.total - ar.total,
                  cpp: a.cpp
                },
                withCpp: {
                  presumed: bp.valid,
                  real: br.valid,
                  presumedTotalComplete: bp.totalComplete,
                  realTotalComplete: br.totalComplete,
                  difference: bp.total - br.total,
                  cpp: b.cpp
                }
              };
            });

            assert.equal(regimeCheck.sensitivity.active, true);
            assert.ok(regimeCheck.sensitivity.breakEvenProfit > 0);
            assert.ok(regimeCheck.sensitivity.breakEvenMargin > 0);
            assert.equal(regimeCheck.sensitivity.scenarios, 3);
            assert.equal(regimeCheck.sensitivity.recommendationKey, 'sensitive');
            assert.equal(regimeCheck.withoutCpp.presumed, true);
            assert.equal(regimeCheck.withoutCpp.real, true);
            assert.equal(regimeCheck.withoutCpp.presumedTotalComplete, false);
            assert.equal(regimeCheck.withoutCpp.realTotalComplete, false);
            assert.equal(regimeCheck.withoutCpp.cpp, 0);
            assert.equal(regimeCheck.withCpp.presumed, true);
            assert.equal(regimeCheck.withCpp.real, true);
            assert.equal(regimeCheck.withCpp.presumedTotalComplete, true);
            assert.equal(regimeCheck.withCpp.realTotalComplete, true);
            assert.ok(regimeCheck.withCpp.cpp > 0);
            assert.equal(regimeCheck.withoutCpp.difference, regimeCheck.withCpp.difference);

            const projectionSwitch = await page.evaluate(() => {
              const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = String(v); };
              set('monthlyCppBase', '');
              set('profitProjectionMode', 'manual');
              const base = modelForYear(2027);
              const point = base.breakEven?.profit || 0;
              set('projectedRealProfitAnnual', point * 0.60);
              const low = modelForYear(2027), lowRec = recommendation(low);
              set('projectedRealProfitAnnual', point * 1.40);
              const high = modelForYear(2027), highRec = recommendation(high);
              set('profitProjectionMode', 'sensitivity');
              set('projectedRealProfitAnnual', '');
              calculate();
              return {
                point,
                lowKey: lowRec.key,
                highKey: highRec.key,
                lowSensitive: low.realDecisionSensitive,
                highSensitive: high.realDecisionSensitive
              };
            });
            assert.ok(projectionSwitch.point > 0);
            assert.equal(projectionSwitch.lowKey, 'real');
            assert.equal(projectionSwitch.highKey, 'presumed');
            assert.equal(projectionSwitch.lowSensitive, false);
            assert.equal(projectionSwitch.highSensitive, false);

            const pedraSensitivity = await page.evaluate(() => {
              const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = String(v); };
              set('monthlyRevenue', 360789.1741666667);
              set('rbt12', 4329470.09);
              set('simpleStatus', 'no');
              set('monthlyCppBase', '');
              set('legacyRate', 10);
              set('presumedIrpjPct', 8);
              set('presumedCsllPct', 12);
              set('realAdditionsAnnual', '');
              set('realExclusionsAnnual', '');
              set('irpjLossCarryforward', '');
              set('csllNegativeBase', '');
              set('profitProjectionMode', 'sensitivity');
              set('projectedRealProfitAnnual', '');
              set('realAccountingProfitAnnual', -183865.94);
              const sensitivity = modelForYear(2027);
              const recSensitivity = recommendation(sensitivity);
              const point = sensitivity.breakEven?.profit || 0;
              set('profitProjectionMode', 'manual');
              set('projectedRealProfitAnnual', 300000);
              const low = modelForYear(2027), lowRec = recommendation(low);
              set('projectedRealProfitAnnual', 500000);
              const high = modelForYear(2027), highRec = recommendation(high);
              set('profitProjectionMode', 'sensitivity');
              set('projectedRealProfitAnnual', '');
              calculate();
              return {
                point,
                margin: sensitivity.breakEven?.margin || 0,
                rec: recSensitivity.key,
                sensitive: sensitivity.realDecisionSensitive,
                low: lowRec.key,
                high: highRec.key
              };
            });
            assert.equal(pedraSensitivity.sensitive, true);
            assert.equal(pedraSensitivity.rec, 'sensitive');
            assert.ok(pedraSensitivity.point > 391000 && pedraSensitivity.point < 393500);
            assert.ok(pedraSensitivity.margin > 0.09 && pedraSensitivity.margin < 0.092);
            assert.equal(pedraSensitivity.low, 'real');
            assert.equal(pedraSensitivity.high, 'presumed');

            await page.evaluate(() => {
              document.getElementById('monthlyCppBase').value = '';
              calculate();
            });
            await page.click('[data-guided-nav="4"]');
            await page.waitForSelector('#guidedReviewGrid');
            const reviewText = await page.textContent('#guidedReviewPanel');
            assert.match(reviewText || '', /Lucro|resultado contábil|lucratividade/i);
            assert.match(reviewText || '', /contribuição patronal/i);
            assert.doesNotMatch(reviewText || '', /Revisar tratamento das receitas/i);

            await page.waitForSelector('.shareholderBrief', { state: 'attached' });
            const ownerBrief = await page.evaluate(() => ({
              currentTax: document.getElementById('ownerCurrentTax')?.textContent || '',
              bestTotal: document.getElementById('ownerBestTotal')?.textContent || '',
              bestLabel: document.getElementById('ownerBestTotalLabel')?.textContent || '',
              breakEven: document.getElementById('ownerProfitBreakEven')?.textContent || '',
              pending: document.getElementById('ownerPending')?.textContent || '',
              why: document.getElementById('ownerWhy')?.textContent || '',
              simpleText: document.querySelector('#technicalReport')?.textContent || '',
              badge: document.querySelector('.modelCard.recommended .badge')?.textContent || '',
              title: document.getElementById('recommendationTitle')?.textContent || '',
              sensitivityAlert: document.getElementById('profitSensitivityAlert')?.textContent || '',
              sensitivityRows: document.querySelectorAll('#profitSensitivityBody tr').length,
              timeline: document.getElementById('timelineBody')?.textContent || ''
            }));
            assert.match(ownerBrief.currentTax, /PENDENTE/i);
            assert.doesNotMatch(ownerBrief.bestTotal, /^—$/);
            assert.match(ownerBrief.bestLabel, /referência histórica/i);
            assert.doesNotMatch(ownerBrief.breakEven, /^—$/);
            assert.match(ownerBrief.pending, /lucratividade futura/i);
            assert.match(ownerBrief.pending, /contribuição patronal/i);
            assert.match(ownerBrief.pending, /carga líquida atual/i);
            assert.match(ownerBrief.why, /ponto aproximado de indiferença|lucratividade futura/i);
            assert.match(ownerBrief.simpleText, /Simples Nacional não aplicável pelo faturamento informado|Referência atual do Simples indisponível/i);
            assert.match(ownerBrief.badge, /REFERÊNCIA HISTÓRICA/i);
            assert.match(ownerBrief.title, /Resultado sensível à lucratividade/i);
            assert.match(ownerBrief.sensitivityAlert, /Resultado condicionado à lucratividade futura/i);
            assert.equal(ownerBrief.sensitivityRows, 3);
            assert.match(ownerBrief.timeline, /Sensível à margem futura/i);

            await page.evaluate(() => {
              const mode = document.getElementById('currentConsumptionMode');
              const tax = document.getElementById('currentConsumptionTaxAnnual');
              const transfer = document.getElementById('priceTransferPct');
              if (mode) mode.value = 'manual';
              if (tax) {
                tax.value = '2842049.06';
                tax.dataset.importVerified = '1';
                tax.dataset.importConfidence = 'low';
                delete tax.dataset.userEdited;
              }
              if (transfer) transfer.value = '100';
              if (typeof calculate === 'function') calculate();
            });
            await page.waitForFunction(() => /Estimativa preliminar/i.test(document.getElementById('economicConfidenceNote')?.textContent || ''));
            const confidenceCheck = await page.evaluate(() => ({
              note: document.getElementById('economicConfidenceNote')?.textContent || '',
              execNote: document.getElementById('execEconomicConfidenceNote')?.textContent || '',
              resultLabel: document.getElementById('techResultEffectLabel')?.textContent || '',
              ownerTaxNote: document.getElementById('ownerCurrentTaxNote')?.textContent || '',
              narrative: document.getElementById('narrativeText')?.textContent || ''
            }));
            assert.match(confidenceCheck.note, /Estimativa preliminar/i);
            assert.match(confidenceCheck.execNote, /Estimativa preliminar/i);
            assert.match(confidenceCheck.resultLabel, /repasse de 100/i);
            assert.match(confidenceCheck.ownerTaxNote, /baixa confiança/i);
            assert.doesNotMatch(confidenceCheck.narrative, /melhor alternativa validada/i);

            const explainCheck = await page.evaluate(() => ({
              lead: document.getElementById('diagnosisExplainLead')?.textContent || '',
              regime: document.getElementById('explainRegimeText')?.textContent || '',
              consumption: document.getElementById('explainConsumptionFormula')?.textContent || '',
              variation: document.getElementById('explainVariationText')?.textContent || '',
              driver: document.getElementById('explainDriverText')?.textContent || '',
              credit: document.getElementById('explainCreditFormula')?.textContent || '',
              caveat: document.getElementById('diagnosisExplainCaveat')?.textContent || ''
            }));
            assert.match(explainCheck.lead, /regras fixas/i);
            assert.match(explainCheck.regime, /Lucro Real|Lucro Presumido|resultado histórico/i);
            assert.match(explainCheck.consumption, /IBS\/CBS bruto/i);
            assert.match(explainCheck.variation, /carga/i);
            assert.match(explainCheck.driver, /principal componente|principal fator|carga futura/i);
            assert.match(explainCheck.credit, /créditos/i);
            assert.match(explainCheck.caveat, /não inventa uma decomposição histórica/i);

            await page.evaluate(() => {
              const mode=document.getElementById('profitProjectionMode');
              const proj=document.getElementById('projectedRealProfitAnnual');
              if(mode)mode.value='manual';
              if(proj)proj.value='450000';
              if(typeof calculate==='function')calculate();
            });
            await page.waitForFunction(() => /projeção de lucro/i.test(document.getElementById('ownerAccountantQuestion')?.textContent || ''));
            await page.evaluate(() => {
              if (typeof setReportView === 'function') setReportView('technical');
              const modal = document.getElementById('reportModal');
              if (modal) modal.hidden = false;
              document.body.classList.add('reportOpen');
              window.dispatchEvent(new Event('beforeprint'));
            });
            await page.emulateMedia({ media: 'print' });
            const printLayout = await page.evaluate(() => {
              const cover = document.querySelector('.technicalPrintCover');
              const compare = document.querySelector('.technicalReport .compareWrap');
              const timeline = document.querySelector('.technicalReport .timelineWrap');
              const technical = document.getElementById('technicalReport');
              const executive = document.getElementById('executiveReport');
              return {
                coverVisible: !!cover && getComputedStyle(cover).display !== 'none',
                ownerBriefVisible: !!document.querySelector('.shareholderBrief') && getComputedStyle(document.querySelector('.shareholderBrief')).display !== 'none',
                explainVisible: !!document.querySelector('.diagnosisExplainSection') && getComputedStyle(document.querySelector('.diagnosisExplainSection')).display !== 'none',
                sensitivityVisible: !!document.querySelector('.profitSensitivitySection') && getComputedStyle(document.querySelector('.profitSensitivitySection')).display !== 'none',
                technicalVisible: !!technical && getComputedStyle(technical).display !== 'none',
                executiveHidden: !executive || getComputedStyle(executive).display === 'none',
                compareFits: !compare || compare.scrollWidth <= compare.clientWidth + 3,
                timelineFits: !timeline || timeline.scrollWidth <= timeline.clientWidth + 3,
                timelineAvoidsSplit: !timeline || ['avoid','avoid-page'].includes(getComputedStyle(timeline).breakInside),
                logoHeight: document.querySelector('.technicalPrintLogoMark img')?.getBoundingClientRect().height || 0,
                publisherWordmark: document.querySelector('.technicalPrintPublisherWordmark')?.textContent || '',
                reportLogoOverflow: getComputedStyle(document.querySelector('.technicalPrintLogoMark')).overflow,
                reportLogoSrc: document.querySelector('.technicalPrintLogoMark img')?.getAttribute('src') || '',
                evidenceCount: document.querySelectorAll('#ownerEvidenceGrid > div').length,
                accountantQuestion: document.getElementById('ownerAccountantQuestion')?.textContent || '',
                title: document.title,
                literalSlashN: [...document.body.childNodes].some(n => n.nodeType === Node.TEXT_NODE && /\\\\n/.test(n.textContent || ''))
              };
            });
            assert.equal(printLayout.coverVisible, true);
            assert.equal(printLayout.ownerBriefVisible, true);
            assert.equal(printLayout.explainVisible, true);
            assert.equal(printLayout.sensitivityVisible, true);
            assert.equal(printLayout.technicalVisible, true);
            assert.equal(printLayout.executiveHidden, true);
            assert.equal(printLayout.compareFits, true);
            assert.equal(printLayout.timelineFits, true);
            assert.equal(printLayout.timelineAvoidsSplit, true);
            assert.ok(printLayout.logoHeight > 35);
            assert.match(printLayout.publisherWordmark, /HOMO FICTOR/i);
            assert.match(printLayout.publisherWordmark, /EDIÇÕES INDEPENDENTES/i);
            assert.equal(printLayout.reportLogoOverflow, 'hidden');
            assert.match(printLayout.reportLogoSrc, /homo-fictor-logo-header\.png/);
            assert.equal(printLayout.evidenceCount, 6);
            assert.match(printLayout.accountantQuestion, /projeção de lucro/i);
            assert.equal(printLayout.literalSlashN, false);
            assert.match(printLayout.title, /Relatório técnico/i);
            await page.pdf({ path: 'simulador-report-print-check.pdf', format: 'A4', printBackground: true, displayHeaderFooter: false, preferCSSPageSize: true });
            await page.emulateMedia({ media: 'screen' });
            await page.evaluate(() => window.dispatchEvent(new Event('afterprint')));

            const relevantConsoleErrors = consoleErrors.filter(x => !/favicon|Failed to load resource.*404/i.test(x));
            if (pageErrors.length || relevantConsoleErrors.length) {
              throw new Error('Browser errors: ' + JSON.stringify({ pageErrors, consoleErrors: relevantConsoleErrors }));
            }

            console.log(JSON.stringify({
              ok: true,
              company,
              activity,
              b2b,
              importCheck,
              regimeCheck,
              url: page.url()
            }, null, 2));

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload print-check PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulador-report-print-check
          path: simulador-report-print-check.pdf
          if-no-files-found: ignore
