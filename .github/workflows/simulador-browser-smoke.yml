            assert.equal(bridgeCheck.known, true);
            assert.equal(bridgeCheck.reconciled, true);
            assert.equal(bridgeCheck.rows, 3);
            assert.match(bridgeCheck.quality, /Atribuição conciliada/i);
            assert.match(bridgeCheck.status, /Composição conciliada/i);
            assert.ok(Math.abs(bridgeCheck.primaryValue) > 0);
            assert.match(bridgeCheck.primary, /PIS|ICMS|IPI|CBS|IBS/i);
            assert.match(bridgeCheck.driver, /ponte conciliada|principal fator/i);

            await page.evaluate(() => {
